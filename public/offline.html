<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Murales PDC</title>
<style>
  :root { --bg:#F3F1EC; --ink:#18171A; --ink-2:#68636A; --sea:#326A82; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font-family: 'DM Sans', system-ui, sans-serif; text-align:center; padding:24px; }
  main { max-width:320px; }
  svg { width:64px; height:64px; }
  h1 { font-size:20px; margin:16px 0 4px; }
  p { color:var(--ink-2); font-size:14px; line-height:1.5; margin:4px 0; }
  button { margin-top:16px; background:var(--sea); color:#fff; border:0; border-radius:999px; padding:12px 24px; font-size:14px; font-weight:600; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#326A82"/><polyline points="28,70 28,30 50,55 72,30 72,70" fill="none" stroke="#F3F1EC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>You’re offline / Sin conexión</h1>
  <p>Murales PDC needs a connection to load new pages. Pages you opened recently still work.</p>
  <p>Murales PDC necesita conexión para cargar páginas nuevas. Las páginas que abriste hace poco siguen disponibles.</p>
  <button onclick="location.reload()">Try again / Reintentar</button>
</main>
</body>
</html>
